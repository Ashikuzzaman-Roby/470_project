<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>User History | Mess Management Pro</title>
    <style>
        /* --- Design Tokens --- */
        :root {
            --bg-dark: #0f0c29;         
            --sidebar-bg: #161625;      
            --card-bg: #1e1e3f;         
            --accent-cyan: #00d1ff;     
            --accent-pink: #ff79c6;     
            --accent-yellow: #f1fa8c;   
            --text-main: #e6e6ef;       
            --text-dim: #a0a0c0;        
            --border-color: #3d3d6e;    
            --active-bg: rgba(0, 209, 255, 0.1);
            --header-gradient: linear-gradient(90deg, #ff79c6 0%, #bd93f9 50%, #00d1ff 100%);
        }

        /* --- Global Resets --- */
        * { box-sizing: border-box; }
        body {
            background: var(--bg-dark);
            color: var(--text-main);
            font-family: 'Segoe UI', Roboto, sans-serif;
            margin: 0; padding: 0; line-height: 1.6;
            overflow-x: hidden;
        }

        .container {
            width: 95%;
            max-width: 1400px;
            margin: 0 auto;
            padding: 20px 10px;
        }

        /* --- Responsive Top Header --- */
        .top-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 20px; background: var(--sidebar-bg);
            border-radius: 20px; border: 1px solid var(--border-color);
            margin-bottom: 30px; gap: 20px;
        }

        .profile-box { display: flex; align-items: center; gap: 15px; }
        .profile-img {
            width: 55px; height: 55px; border-radius: 50%;
            border: 2px solid var(--accent-cyan); object-fit: cover;
        }

        .header-btns { display: flex; gap: 12px; }
        .nav-btn {
            padding: 10px 18px; border-radius: 12px; font-weight: bold;
            text-decoration: none; transition: 0.3s; font-size: 14px;
            cursor: pointer; display: flex; align-items: center; gap: 8px;
        }

        .btn-dash { background: var(--active-bg); color: var(--accent-cyan); border: 1px solid var(--accent-cyan); }
        .btn-logout { background: rgba(255, 121, 198, 0.1); color: var(--accent-pink); border: 1px solid var(--accent-pink); }

        /* --- Premium Stat Cards (Neon Effect) --- */
        .history-grid {
            display: grid; 
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px; margin-bottom: 40px;
        }

        .stat-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 20px; padding: 30px 20px; text-align: center; 
            position: relative; overflow: hidden;
            transition: all 0.4s cubic-bezier(0.175, 0.885, 0.32, 1.275);
            box-shadow: 0 10px 25px rgba(0,0,0,0.4);
        }

        .stat-card:hover {
            transform: translateY(-8px);
            border-color: var(--accent-cyan);
            box-shadow: 0 0 20px rgba(0, 209, 255, 0.15);
        }

        /* Neon Glow Inner Effect */
        .stat-card::after {
            content: ""; position: absolute; top: -50%; left: -50%;
            width: 200%; height: 200%;
            background: radial-gradient(circle, rgba(0, 209, 255, 0.03) 0%, transparent 60%);
            pointer-events: none;
        }

        .stat-card h3 { font-size: 0.9rem; color: var(--text-dim); text-transform: uppercase; margin-bottom: 10px; }
        .stat-card .value { 
            font-size: 36px; font-weight: 800; 
            background: var(--header-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent;
        }

        /* --- Section Titles --- */
        .section-title { color: var(--accent-cyan); margin: 40px 0 20px; font-size: 1.4rem; font-weight: 600; }

        /* --- Incoming Request Grid --- */
        .requests-grid {
            display: grid; grid-template-columns: repeat(auto-fill, minmax(280px, 1fr));
            gap: 20px;
        }

        .request-card {
            background: var(--card-bg); border: 1px solid var(--border-color);
            border-radius: 20px; padding: 20px; text-align: center;
        }

        .req-profile-img { width: 70px; height: 70px; border-radius: 50%; border: 2px solid var(--accent-pink); margin-bottom: 12px; }
        .card-actions { display: flex; gap: 10px; margin-top: 15px; }
        .action-btn { flex: 1; padding: 10px; border-radius: 10px; border: none; font-weight: bold; cursor: pointer; transition: 0.2s; }
        .btn-accept { background: #2ecc71; color: #fff; }
        .btn-reject { background: #e74c3c; color: #fff; }

        /* --- Glassmorphism Table --- */
        .table-wrapper {
            background: var(--card-bg); border-radius: 20px;
            border: 1px solid var(--border-color); overflow-x: auto;
            box-shadow: 0 15px 35px rgba(0,0,0,0.3);
        }

        table { width: 100%; border-collapse: collapse; min-width: 600px; }
        th, td { padding: 18px; text-align: left; border-bottom: 1px solid var(--border-color); }
        th { color: var(--accent-yellow); background: rgba(255,255,255,0.03); font-size: 13px; text-transform: uppercase; }
        
        /* --- Status Badges --- */
        .status-badge {
            padding: 5px 12px; border-radius: 15px; font-size: 11px; font-weight: 700;
            text-transform: uppercase; display: inline-block;
        }
        .status-confirmed { background: rgba(46, 204, 113, 0.15); color: #2ecc71; border: 1px solid #2ecc7144; }
        .status-pending { background: rgba(241, 250, 140, 0.15); color: var(--accent-yellow); border: 1px solid #f1fa8c44; }
        .status-rejected, .status-cancelled { background: rgba(231, 76, 60, 0.15); color: #e74c3c; border: 1px solid #e74c3c44; }

        /* --- Responsive Media Queries --- */
        @media (max-width: 768px) {
            .top-header { flex-direction: column; text-align: center; }
            .header-btns { width: 100%; justify-content: center; }
            .history-grid { grid-template-columns: 1fr; }
            .stat-card { padding: 20px; }
            .stat-card .value { font-size: 28px; }
            h2 { font-size: 1.6rem !important; text-align: center; }
        }

    </style>
</head>
<body>

<div class="container">
    <header class="top-header">
        <div class="profile-box">
            <img src="https://via.placeholder.com/100" id="user-pfp" class="profile-img">
            <div class="profile-text">
                <span class="username" id="display-username" style="font-weight: bold; font-size: 1.1rem;">Gemini User</span>
                <p style="margin:0; font-size: 12px; color: var(--text-dim);">Mess Member | Active</p>
            </div>
        </div>
        <div class="header-btns">
            <a href="./user.html" class="nav-btn btn-dash">🏠 Dashboard</a>
            <button class="nav-btn btn-logout" onclick="logout()">Logout 🚪</button>
        </div>
    </header>

    <h2 style="background: var(--header-gradient); -webkit-background-clip: text; -webkit-text-fill-color: transparent; font-size: 2.2rem; margin-bottom: 30px;">Activity History</h2>

    <div class="history-grid">
        <div class="stat-card">
            <h3>Total Meals</h3>
            <div class="value" id="total-meals">0</div>
        </div>
        <div class="stat-card">
            <h3>Estimated Cost</h3>
            <div class="value" id="total-bazar">৳ 0</div>
        </div>
        <div class="stat-card">
            <h3>Pending Requests</h3>
            <div class="value" id="pending-req">0</div>
        </div>
    </div>

    <h3 class="section-title">📥 Incoming Rental Requests</h3>
    <div class="requests-grid" id="requests-container">
        </div>

    <h3 class="section-title">📊 Your Booking History</h3>
    <div class="table-wrapper">
        <table>
            <thead>
                <tr>
                    <th>Product Title</th>
                    <th>Booking Dates</th>
                    <th>Amount</th>
                    <th>Status</th>
                </tr>
            </thead>
            <tbody id="history-table-body">
                </tbody>
        </table>
    </div>
</div>

<script>
    const userId = localStorage.getItem('userId') || 6;
    const API_BASE_URL = 'http://localhost:8000';

    function logout() {
        if(confirm("Logout?")) { localStorage.clear(); window.location.href = "./login.html"; }
    }

    // ১. স্ট্যাটাস লোড করা
    async function fetchUserStats() {
        try {
            const res = await fetch(`${API_BASE_URL}/api/user_meal_summary/${userId}`);
            const data = await res.json();
            if (data.success) {
                document.getElementById('total-meals').innerText = data.totalMeals;
                document.getElementById('total-bazar').innerText = `৳ ${data.userCost}`;
                document.getElementById('pending-req').innerText = data.pendingRequests;
            }
        } catch (e) { console.error("Stats Error"); }
    }

    // ২. ইনকামিং রিকোয়েস্ট লোড করা (এই একটি ফাংশনই যথেষ্ট)
    async function fetchIncomingRequests() {
        // Load and display all incoming rental booking requests for property owner
        // এখানে আইডি 'requests-container' হবে, কারণ তোমার HTML এ এটাই আছে
        const container = document.getElementById('requests-container'); 
        
        try {
            const response = await fetch(`${API_BASE_URL}/api/incoming-requests/${userId}`);
            const data = await response.json();

            if (data.success && data.requests.length > 0) {
                container.innerHTML = data.requests.map(req => {
                    // তারিখের রেঞ্জ তৈরি করা (ব্যাকএন্ড থেকে আসলে)
                    let dateDisplay = `📅 ${req.start_date || 'N/A'} - ${req.end_date || 'N/A'}`;
                    // এই অংশটুকু তোমার কোডে ঠিক আছে কি না মিলিয়ে নাও
                    // let dateDisplay = `📅 ${req.start_date} - ${req.end_date}`;
                    
                    return `
                        <div class="request-card">
                            <img src="https://cdn-icons-png.flaticon.com/512/149/149071.png" class="req-profile-img">
                            <h4>${req.sender_name}</h4>
                            <p class="req-mess-name">🏠 ${req.mess_name}</p>
                            <p class="req-cost">💰 ৳ ${req.amount}</p>
                            
                            <p class="req-date" style="font-weight: bold; color: #f39c12; margin: 10px 0;">
                                ${dateDisplay}
                            </p>

                            <div class="card-actions">
                                <button class="action-btn btn-accept" onclick="updateStatus(${req.id}, 'accepted')">Accept</button>
                                <button class="action-btn btn-reject" onclick="updateStatus(${req.id}, 'rejected')">Reject</button>
                            </div>
                        </div>
                    `;
                }).join('');
            } else {
                container.innerHTML = `<p style="color:var(--text-dim); text-align:center; grid-column:1/-1;">No new requests found.</p>`;
            }
        } catch (err) {
            console.error("Error fetching requests:", err);
            container.innerHTML = '<p class="error">Failed to load requests.</p>';
        }
    }



    // ৩. নিজের বুকিং হিস্ট্রি টেবিল লোড করা
    async function fetchRentalHistory() {
        // Retrieve user's rental booking history with dates and status
        const tbody = document.getElementById('history-table-body');
        try {
            const res = await fetch(`${API_BASE_URL}/api/user-rental-history/${userId}`);
            const data = await res.json();
            if (data.success) {
                tbody.innerHTML = data.history.map(item => `
                    <tr>
                        <td>${item.mess_name}</td>
                        <td>${item.dates}</td>
                        <td>৳ ${item.total_price}</td>
                        <td><span class="status-badge status-${item.status}">${item.status.toUpperCase()}</span></td>
                    </tr>
                `).join('');
            }
        } catch (e) { tbody.innerHTML = "<tr><td colspan='4'>Error loading history</td></tr>"; }
    }

    // ৪. স্ট্যাটাস আপডেট (Accept/Reject)


    async function updateStatus(bookingId, action) {
        // Accept or reject booking request and update status in database
        let statusName;

        if (action === 'accepted') {
            statusName = 'confirmed';
        } else if (action === 'rejected') {
            statusName = 'cancelled';
        }

        // তোমার চাওয়া লাইনটি এখানে এভাবে ব্যবহার করো
        if (!statusName) {
            alert("Invalid Action!");
            return; // স্ট্যাটাস না থাকলে এখানেই কোড থেমে যাবে, নিচে আর যাবে না
        }

        try {
            const response = await fetch(`${API_BASE_URL}/api/update-booking-status/${bookingId}`, {
                method: 'PUT',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify({ status: statusName })
            });

            const data = await response.json();
            if (data.success) {
                alert(`Booking has been ${statusName}!`);
                location.reload(); 
            }
        } catch (err) {
            console.error("Update error:", err);
        }
    }



    // user will see own request of rental : 

    async function fetchRentalHistory() {
        const tbody = document.getElementById('history-table-body');
        try {
            const res = await fetch(`${API_BASE_URL}/api/user-rental-history/${userId}`);
            const data = await res.json();
            
            if (data.success && data.history.length > 0) {
                tbody.innerHTML = data.history.map(item => {
                    let statusClass = '';
                    let displayStatus = item.status.toUpperCase();

                    // স্ট্যাটাস অনুযায়ী CSS ক্লাস সেট করা
                    if (item.status === 'confirmed') {
                        statusClass = 'status-confirmed';
                    } else if (item.status === 'pending') {
                        statusClass = 'status-pending';
                    } else {
                        statusClass = 'status-rejected'; // cancelled বা rejected এর জন্য
                    }
                    // টেবিল রেন্ডার করার সময় এই নামগুলো ব্যবহার করো
                    return `
                        <tr>
                            <td>${item.title}</td> <td>${item.dates}</td>
                            <td>৳ ${item.amount}</td> <td><span class="status-badge ${statusClass}">${item.status.toUpperCase()}</span></td>
                        </tr>
                    `;

                    
                }).join('');
            } else {
                tbody.innerHTML = "<tr><td colspan='4' style='text-align:center;'>No booking history found.</td></tr>";
            }
        } catch (e) { 
            console.error("History load error:", e);
            tbody.innerHTML = "<tr><td colspan='4'>Error loading history</td></tr>"; 
        }
    }











    // পেজ লোড হলে সব কল হবে
    window.addEventListener('DOMContentLoaded', () => {
        fetchUserStats();
        fetchIncomingRequests();
        fetchRentalHistory();
    });
</script>

</body>
</html>
